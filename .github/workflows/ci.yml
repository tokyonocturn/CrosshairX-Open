name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Smoke test the binary
        run: |
          .\target\release\crosshairx-open.exe --version
          .\target\release\crosshairx-open.exe --export-previews previews
          if (-not (Test-Path previews\classic_cross.png)) { throw "preset rendering produced no PNG" }
        shell: pwsh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: crosshairx-open-windows-x64
          path: target/release/crosshairx-open.exe
          if-no-files-found: error
