name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Smoke test the binary
        shell: pwsh
        run: |
          # The release binary is a GUI-subsystem executable, so PowerShell does not
          # wait for it on its own; -Wait makes the exit code and the files meaningful.
          $exe = Join-Path "target" "release" "crosshairx-open.exe"
          $version = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          if ($version.ExitCode -ne 0) { throw "--version exited with $($version.ExitCode)" }

          $export = Start-Process -FilePath $exe -ArgumentList "--export-previews", "previews" -Wait -PassThru -NoNewWindow
          if ($export.ExitCode -ne 0) { throw "--export-previews exited with $($export.ExitCode)" }

          $png = Join-Path "previews" "classic_cross.png"
          if (-not (Test-Path $png)) { throw "preset rendering produced no PNG" }
          if ((Get-Item $png).Length -lt 1000) { throw "rendered PNG is suspiciously small" }
          Get-ChildItem previews | Select-Object Name, Length | Format-Table

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: crosshairx-open-windows-x64
          path: target/release/crosshairx-open.exe
          if-no-files-found: error
