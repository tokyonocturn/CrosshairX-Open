[workspace]
members = ["crates/crosshair-core"]
resolver = "2"

[workspace.lints.clippy]
# Test fixtures read better as "start from the defaults, then change two fields".
field_reassign_with_default = "allow"

[package]
name = "crosshairx-open"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
description = "Free, open-source crosshair overlay for Windows"
license = "MIT"
repository = "https://github.com/tokyonocturn/CrosshairX-Open"

[lints]
workspace = true

[dependencies]
crosshair-core = { path = "crates/crosshair-core" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
